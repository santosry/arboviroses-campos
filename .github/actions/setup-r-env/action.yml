name: Setup R + renv
description: >
  Instala a versao do R registrada em renv.lock, as dependencias de sistema
  e restaura o ambiente renv do projeto.

inputs:
  working-directory:
    description: Diretorio do projeto que contem o renv.lock
    required: false
    default: arboviroses-campos
  cache-version:
    description: Versao do cache do renv
    required: false
    default: "2"

runs:
  using: composite
  steps:
    - name: Setup R (versao do renv.lock)
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: renv
        working-directory: ${{ inputs.working-directory }}
        use-public-rspm: true

    - name: Instalar dependencias de sistema
      shell: bash
      run: |
        sudo apt-get update -y
        sudo apt-get install -y \
          libcurl4-openssl-dev libssl-dev libxml2-dev libgdal-dev \
          libgeos-dev libproj-dev libudunits2-dev

    - name: Restaurar ambiente renv
      uses: r-lib/actions/setup-renv@v2
      with:
        working-directory: ${{ inputs.working-directory }}
        cache-version: ${{ inputs.cache-version }}
