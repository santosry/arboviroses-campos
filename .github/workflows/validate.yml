name: Validate Pipeline and Tests (arboviroses-campos)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arboviroses-campos

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ARBOVIROSES_DOWNLOAD: "false"
      RENV_PATHS_ROOT: ~/.cache/R/renv

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup R + renv
        uses: ./.github/actions/setup-r-env

      - name: Run pipeline (no download)
        run: |
          source("scripts/update_data.R")
        shell: Rscript {0}

      - name: Run tests
        run: |
          testthat::test_dir("tests/testthat")
        shell: Rscript {0}

      - name: Verify deployment bundle contains app data
        run: |
          required <- c(
            "app.R",
            list.files("R", pattern = "\\.R$", full.names = TRUE),
            list.files("data/cache_app", full.names = TRUE)
          )
          bundle <- rsconnect::listBundleFiles(".")$contents
          missing <- setdiff(required, bundle)
          if (length(missing) > 0) {
            stop("Arquivos obrigatorios fora do bundle: ", paste(missing, collapse = ", "))
          }
          cat(
            "Bundle OK:", length(bundle), "arquivos;",
            length(grep("^data/cache_app/", bundle)), "arquivos de cache.\n"
          )
        shell: Rscript {0}

      - name: Smoke test - app and data load
        run: |
          app <- source("app.R", local = new.env())
          if (!inherits(app$value, "shiny.appobj")) {
            stop("app.R nao retornou um shiny.appobj")
          }
          cat("App carregado com sucesso a partir de app.R.\n")
        shell: Rscript {0}

      - name: Verify caches
        run: |
          cat("=== Verificando caches finais ===\n")
          caches <- list.files("data/cache_app", pattern = "\\.rds$", full.names = TRUE)
          for (f in caches) {
            obj <- readRDS(f)
            cat(basename(f), ":", nrow(obj), "linhas,", ncol(obj), "colunas\n")
          }
          cat("=== metadata.json ===\n")
          if (file.exists("data/cache_app/metadata.json")) {
            cat(readLines("data/cache_app/metadata.json"), sep = "\n")
          }
        shell: Rscript {0}

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            arboviroses-campos/data/audit/
            arboviroses-campos/data/cache_app/metadata.json
